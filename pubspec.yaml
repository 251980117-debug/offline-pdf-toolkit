name: offline_pdf_toolkit
description: Offline PDF Toolkit. All document processing happens on the device.
publish_to: 'none'
version: 0.4.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  # Pinned on purpose. Upgrade only after the validation suite passes again.
  pdfrx: 2.6.6
  image: ^4.8.0
  path: ^1.9.1
  path_provider: ^2.1.5
  file_picker: ^13.1.0
  share_plus: ^13.3.1
  image_picker: ^1.2.4

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/validation/
